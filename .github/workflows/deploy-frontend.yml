name: Publicar frontend (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ["frontend/**", "deployments/sepolia.json", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generar configuración pública desde deployments/sepolia.json
        run: |
          node -e '
          const d = require("./deployments/sepolia.json");
          const lines = [
            `VITE_CHAIN_ID=${d.chainId}`,
            `VITE_EXPLORER=${d.explorer}`,
            `VITE_VAULT_ADDRESS=${d.contracts.vault.address}`,
            `VITE_ASSET_ADDRESS=${d.contracts.asset.address}`,
            `VITE_STRATEGY_ADDRESS=${d.contracts.strategy.address}`,
          ];
          require("fs").writeFileSync("frontend/.env.production", lines.join("\n") + "\n");
          '
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
